<script>
'use strict';
// Chapter 9 so far: part 1 (motion; relative motion) and part 2 (speed), one page; velocity and acceleration come later.
const CHAPTER = { number: 9, title: 'Motion · Parts 1–2: Relative Motion and Speed', minutes: 9, language: 'en' };

/* ---------- chapter helpers ---------- */
const V = 150;                                   // 30 mph on screen, in world px per second (same scale in every road beat)
const MPH = v => Math.round(Math.abs(v) / V * 30);
const speedStr = rel => { const n = MPH(rel); return n === 0 ? '0 mph' : rel > 0 ? `${n} mph →` : `← ${n} mph`; };
const Q_CARD = { x: 96, y: 586, w: 1408, cls: 'band' };   // band card lifted above the usual BAND, for longer feedback
const Q2_CARD = { x: 96, y: 446, w: 1408, cls: 'band' };  // higher still: the speed check has two rows of boxes
const txt = (p, s, x, y, t0, { size = 32, fill = COL.chalk, anchor = 'middle', weight = 600 } = {}) => { const e = T(p, s, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
// One line with coloured runs: [[text, colour?], …].
function runs(p, parts, { x, y, size = 40, anchor = 'middle', weight = 600, o = 0 }) {
  const t = T(p, '', { x, y, size, anchor, weight, o });
  parts.forEach(([s, c]) => { const sp = mk('tspan', { fill: c || COL.chalk }, t); sp.textContent = s; });
  return t;
}
function arrowPath(x1, y, x2) { const d = Math.sign(x2 - x1); return `M${x1} ${y}H${x2}M${x2 - 16 * d} ${y - 11}L${x2} ${y}L${x2 - 16 * d} ${y + 11}`; }
// "Measured from: …" tag at the left, top by default (screen space).
function fromTag(p, str, t0, dur = .5, y = 136) {
  const g = G(p, { o: 0 });
  phPin(g, { x: 112, y: y + 14, s: .8 });
  runs(g, [['Measured from:  ', COL.dim], [str, PH.ref]], { x: 146, y, size: 34, anchor: 'start', o: 1 });
  show(g, t0, dur);
  return g;
}
// Earth from above the North Pole, in a camera's world. The overview camera (800, 450, z 1) shows it at (EX, EY).
const EX = 430, EY = 450, ER = 200, ESPIN = -14;              // spin in degrees per second; negative = counterclockwise
const rimAngle = t => (-90 + ESPIN * t) * Math.PI / 180;      // where "you" are on the rim at time t
// A camera locked onto you, rolling with the ground, `lift` world px above it.
const groundView = (lift, z) => ({ x: t => EX + (ER + lift) * Math.cos(rimAngle(t)), y: t => EY + (ER + lift) * Math.sin(rimAngle(t)), z, r: t => ESPIN * t });
function earthWorld(cam, D) {
  const E = phEarthPolar(cam.world, { x: EX, y: EY, R: ER });
  const rim = deg => G(G(E._spin, { r: deg }), { y: -ER });
  const gr = ER - 3, ga = .4;   // ±23° of smooth ground under the rim scene (the pixel coast is stepped)
  path(E._spin, `M${-gr * Math.sin(ga)} ${-gr * Math.cos(ga)}A${gr} ${gr} 0 0 1 ${gr * Math.sin(ga)} ${-gr * Math.cos(ga)}`, { stroke: PH.land, 'stroke-width': 6, 'stroke-linecap': 'butt' });
  phSprite(rim(-9), 'house', { s: .25 }); phSprite(rim(7), 'tree', { s: .22 });   // the narration's buildings, trees and you
  const you = rim(0);
  phPerson(you, { s: .25 });
  clockRun(t => put(E._spin, { r: ESPIN * t }), D);
  return { E, you };
}
// Split screen: the truck and car drive slower than elsewhere (the views are small) so the truck stays inside the roadside
// view for the whole beat; both labels are always visible.
const SPLIT_V = 50, splitX = t => 760 + SPLIT_V * t;

/* ---------- section 2 (speed) helpers ---------- */
const DIST = COL.rat, TIME = COL.whole;          // distance pink (as "change of position" in part 1), time blue
const walkTo = (r, x, step = 22) => phPose(r, 'walk', x / step * Math.PI);   // two frames per stride, from x
// A measured track: a bar with ticks every `every` meters from 0 to `to`, U px per meter.
function meterTrack(p, { x0, U, y, to, every, size = 26 }) {
  const g = G(p);
  phBlock(g, x0 - 20, y, U * to + 40, 14, '#8a6f55', { top: 4, ol: 0 });
  for (let v = 0; v <= to; v += every) {
    mk('rect', { x: x0 + U * v - 2, y: y + 14, width: 4, height: 14, fill: COL.dim }, g);
    T(g, String(v), { x: x0 + U * v, y: y + 56, size, fill: COL.chalk, anchor: 'middle' });
  }
  T(g, 'meters', { x: x0 + U * to + 36, y: y + 56, size: size - 2, fill: COL.dim });
  return g;
}
// A fraction in words or numbers (upright text, no math italics), centred on x with its bar at y.
function wfrac(p, top, bot, x, y, { size = 44, ct = COL.chalk, cb = COL.chalk, o = 0 } = {}) {
  const g = G(p, { x, y, o }), w = Math.max(uiW(top, size), uiW(bot, size)) + 24;
  T(g, top, { y: -size * .32, size, fill: ct, anchor: 'middle', weight: 600 });
  mk('rect', { x: -w / 2, y: -2, width: w, height: 4, rx: 2, fill: COL.chalk }, g);
  T(g, bot, { y: size * 1.02, size, fill: cb, anchor: 'middle', weight: 600 });
  g._w = w;
  return g;
}
// A sim clock: stopwatch plus "N s" under it; set(sec) turns the hand (one turn per minute) and writes whole seconds.
function simClock(p, x, y, r = 46) {
  const sw = phStopwatch(p, { x, y, r }), lab = T(p, '0 s', { x, y: y + r + 48, size: 32, weight: 700, fill: TIME, anchor: 'middle' });
  return { sw, lab, set(sec) { put(sw._hand, { r: sec * 6 }); phText(lab, `${Math.floor(sec + 1e-6)} s`); } };
}
const ramp = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
// Sprint model for the 100 m dash: speed rises quickly and levels off; 100 m at 10 s; about 12 m/s at the finish.
const SK = 1.4, SVM = 100 / (10 - SK * (1 - Math.exp(-10 / SK)));
const sprintX = tau => SVM * (tau - SK * (1 - Math.exp(-tau / SK))), sprintV = tau => SVM * (1 - Math.exp(-tau / SK));
// The stop-and-go car: 15 m/s for 10 s, stopped 8 s at a red light, 12.5 m/s for 12 s: 300 m in 30 s.
const tripX = s => s < 10 ? 15 * s : s < 18 ? 150 : 150 + 12.5 * (Math.min(s, 30) - 18);
const tripV = s => s < 10 ? 15 : s < 18 ? 0 : s < 30 ? 12.5 : 0;

/* ---------- beats ---------- */
const BEATS = [
['intro', 'Motion', (m, D) => {
  const p = panel(0);
  const cam = camera(p, D, { x: 800, y: 285, z: .9 });
  const road = phRoad(cam);
  const carX = t => -260 + 190 * t;
  const car = phCar(road.vehicles, { y: ROAD.near });
  cam.to({ x: t => carX(t) + 330 }, 2.4, 2);                 // lock on: from here the camera rides with the car
  clockRun(t => {
    const x = carX(t); put(car, { x }); phRoll(car, x);
  }, D);
  const g = G(p, { o: 0, y: 24 });
  T(g, 'Unit 3 · Motion, Forces, and Work · Chapter 9', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle' });
  phLabel(g, 'Motion', { x: 800, y: 250, size: 120, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out);
  txt(p, 'Part 1 · Motion and relative motion', 800, 320, m('sub'), { size: 36, fill: COL.dim });
}],
['position', 'Motion is a change of position', (m, D) => {
  const p = panel(0);
  const cam = camera(p, D, { x: 800, y: 420, z: .55 });
  cam.to({ x: 800, y: 450, z: 1 }, .1, 1.6);                // wide shot of the park, pushing in to the track
  const w = cam.world;
  phHills(w, { y: 470, amp: 30, x0: -1400, x1: 3000, fill: PH.hill2, seed: 2 });
  phBlock(w, -1400, 520, 4400, 1200, PH.grass, { top: 6, ol: 0 });
  phSprite(w, 'tree', { x: -200, y: 540 }); phSprite(w, 'tree', { x: 1820, y: 548 });
  const X0 = 200, U = 120, TY = 600, R = 40, xm = v => X0 + U * v;
  const track = G(w);
  phBlock(track, X0 - 30, TY, U * 10 + 60, 16, '#8a6f55', { top: 4, ol: 2 });
  for (let v = 0; v <= 10; v++) {
    mk('rect', { x: xm(v) - 2, y: TY + 16, width: 4, height: 16, fill: COL.dim }, track);
    T(track, String(v), { x: xm(v), y: TY + 68, size: 28, fill: COL.chalk, anchor: 'middle' });
  }
  T(track, 'meters', { x: xm(10) + 40, y: TY + 68, size: 26, fill: COL.dim });
  T(track, 'zero mark', { x: xm(0), y: TY + 104, size: 24, fill: COL.dim, anchor: 'middle' });
  txt(p, 'Position: where something is, measured from a starting mark', 800, 150, 1.4, { size: 34, fill: COL.dim });
  const ghost = mk('circle', { cx: xm(2), cy: TY - R, r: R, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, w);
  put(ghost, { o: 0 });
  const ball = phBall(w, R, { x: xm(2), y: TY - R });
  const at2 = txt(w, 'position: 2 m', xm(2), TY - 110, m('pos'), { size: 32 });
  hide(at2, m('roll'), .4); show(ghost, m('roll'), .4);
  prog(q => { const x = xm(2) + U * 5 * q; put(ball, { x }); put(ball._spin, { r: (x - xm(2)) / R * 180 / Math.PI }); }, m('roll', .1), 2.2, io);
  txt(w, 'position: 7 m', xm(7), TY - 110, m('now'), { size: 32 });
  const ch = G(w, { o: 0 });
  path(ch, arrowPath(xm(2), TY + 150, xm(7)), { stroke: PH.change, 'stroke-width': 5 });
  T(ch, 'change of position: 5 m', { x: xm(4.5), y: TY + 200, size: 32, fill: PH.change, weight: 700, anchor: 'middle' });
  show(ch, m('change'));
  const rule = runs(p, [['Motion', COL.chalk], [' = a ', COL.chalk], ['change of position', PH.change]], { x: 800, y: 270, size: 60 });
  show(rule, m('rule'));
  const sw = phStopwatch(p, { x: 1330, y: 400, r: 52, o: 0 });
  show(sw, m('still'));
  const clockT = txt(p, '0 s later', 1330, 500, m('still'), { size: 28, fill: COL.dim });
  prog(q => { put(sw._hand, { r: 90 * q }); clockT.textContent = `${Math.round(3 * q)} s later`; }, m('still', .3), 3, lin);
  txt(p, 'still at 7 m: not moving', 1330, 540, m('still', 3.4), { size: 28, fill: COL.chalk });
}],
['everywhere', 'Motion is everywhere', (m, D) => {
  const p = panel(0);
  txt(p, 'Motion is everywhere', 800, 140, .2, { size: 48 });
  const frame = (cx, t0, cap) => {
    const g = G(p, { o: 0 });
    mk('rect', { x: cx - 210, y: 210, width: 420, height: 370, rx: 22, fill: '#22332d', stroke: COL.faint, 'stroke-width': 2 }, g);
    T(g, cap, { x: cx, y: 640, size: 32, weight: 600, anchor: 'middle' });
    show(g, t0);
    return g;
  };
  const f1 = frame(300, m('page'), 'turning a page');
  const book = phNotebook(f1, { x: 300, y: 380, s: 1.05 });
  const f2 = frame(800, m('earth'), 'Earth orbiting the Sun');
  mk('circle', { cx: 800, cy: 395, r: 140, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 10' }, f2);
  const sun = phSun(f2, { x: 800, y: 395, r: 42 });
  const earth = phEarthSmall(f2, { r: 22 });
  const f3 = frame(1300, m('you'), 'you, walking');
  phBlock(f3, 1092, 540, 416, 38, PH.grass, { top: 5, ol: 0 });
  const you = phPerson(f3, { x: 1160, y: 540, s: .95 });
  const tp = m('page'), te = m('earth'), ty = m('you');
  clockRun(t => {
    const c = Math.max(0, t - tp - .3) % 2.4;
    phFlip(book, 180 * soft(Math.min(1, c / 1.4)));
    const a = (-90 - 40 * Math.max(0, t - te + .5)) * Math.PI / 180;   // counterclockwise, seen from above the North Pole
    put(earth, { x: 800 + 140 * Math.cos(a), y: 395 + 140 * Math.sin(a) });
    put(sun._rays, { r: 8 * t });
    const d = Math.min(260, Math.max(0, t - ty) * 85);
    put(you, { x: 1160 + d }); phPose(you, d > 0 && d < 260 ? 'walk' : 'stand', d / 22 * Math.PI);
  }, D);
}],
['roadside', 'Standing by the road', (m, D) => {
  const p = panel(0);
  const cam = camera(p, D);
  const road = phRoad(cam);
  const you = phPerson(road.side, { x: 760, y: ROAD.side, o: 0 });
  show(you, m('stand'));
  show(phLabel(road.front, 'you', { x: 760, y: 336, fill: PH.you, o: 0 }), m('stand'));
  const truck = phTruck(road.vehicles, { y: ROAD.far });
  const tl = phLabel(road.front, `truck: ${speedStr(V)}`, { y: 350, fill: PH.truck, o: 0 });
  fromTag(p, 'you, by the road', m('speed'));
  pop(phPin(road.front, { x: 760, y: 304, s: 0, o: 0 }), m('speed'));
  show(tl, m('speed'));
  const t0 = m('truck', -.3);
  clockRun(t => {
    const x = -250 + V * Math.max(0, t - t0);
    put(truck, { x }); phRoll(truck, x); put(tl, { x: x + 10 });
  }, D);
}],
['incar', 'Riding beside the truck', (m, D) => {
  const p = panel(0);
  const cam = camera(p, D);
  const road = phRoad(cam, { trees: [300, 800, 1900] });   // no tree behind the friend (1100) or the friend's label
  const FR = 1100, tc = m('car', .3), r0 = m('ride');
  const xw = t => -330 + V * Math.max(0, t - tc);            // world position of the truck and the car (side by side)
  // Hard cut at "ride": the camera now rides in the car (locked on it, a little closer, with a light road shake).
  cam.cut({ x: t => xw(t) + 10, y: 600, z: 1.15 }, r0);
  phPerson(road.side, { role: 'friend', x: FR, y: ROAD.side });
  const truck = phTruck(road.vehicles, { y: ROAD.far });
  const car = phCar(road.vehicles, { y: ROAD.near });
  // Speed labels live in screen space and are kept inside the frame (cam.track); wrappers fade them in.
  const tag = (fill, t0) => { const g = G(p, { o: 0 }); show(g, t0); return phLabel(g, '', { fill }); };
  const fl = tag(PH.friend, .4), tl = tag(PH.truck, tc + 1.6), cl = tag(PH.car, tc + 1.6);
  const sl = phLabel(p, 'road and trees: ← 30 mph', { x: 70, y: 862, size: 30, fill: COL.dim, anchor: 'start', o: 0 });
  show(sl, m('back'));
  const pinA = phPin(road.side, { x: FR, y: 304, o: 0 }), pinB = phPin(car, { x: 30, y: -112, s: 0, o: 0 });
  show(pinA, .3); hide(pinA, r0, 0); pop(pinB, r0 + .3);
  const tagA = fromTag(p, 'the roadside', .3);
  hide(tagA, r0, 0); fromTag(p, 'your car', r0, 0, 800);   // bottom: the friend slides through the top
  clockRun(t => {
    const x = xw(t), camV = t < r0 ? 0 : V, rel = t < tc ? 0 : V - camV;
    put(truck, { x }); put(car, { x: x + 10 });
    phRoll(truck, x + 330); phRoll(car, x + 330);
    phText(fl, `friend: ${speedStr(-camV)}`); cam.track(fl, FR, 336, t);
    phText(tl, `truck: ${speedStr(rel)}`); cam.track(tl, x + 10, 350, t);
    phText(cl, `your car: ${speedStr(rel)}`); cam.track(cl, x + 10, ROAD.bot + 56, t);
  }, D);
}],
['rule', 'Motion is relative', (m, D) => {
  const p = panel(0);
  // Split screen: the same street through two cameras at once, one standing by the road, one riding in the car.
  const view = (box, t0, title, ride) => {
    const cam = camera(p, D, { box, x: 1200, y: 560, z: .45 });
    if (ride) cam.cut({ x: t => splitX(t) + 10 }, 0);
    const r = phRoad(cam, { hills: false });
    phPerson(r.scenery, { role: 'friend', x: 480, y: ROAD.side });
    if (!ride) phPin(r.scenery, { x: 480, y: 330, s: 1.1 });
    const truck = phTruck(r.vehicles, { y: ROAD.far }), car = phCar(r.vehicles, { y: ROAD.near });
    if (ride) phPin(car, { x: 30, y: -112, s: 1.4 });
    const lab = phLabel(r.front, ride ? 'truck: 0 mph' : 'truck: 30 mph →', { y: 340, size: 56, fill: PH.truck });
    clockRun(t => {
      const x = splitX(t);
      put(truck, { x }); put(car, { x: x + 10 }); put(lab, { x: x + 10 });
      phRoll(truck, x); phRoll(car, x);
    }, D);
    put(cam.el, { o: 0 }); show(cam.el, t0);
    show(phLabel(p, title, { x: box[0] + 24, y: box[1] + box[3] - 22, size: 28, fill: PH.ref, anchor: 'start', o: 0 }), t0);
  };
  view([80, 120, 700, 380], m('side', -.4), 'from the roadside', false);
  view([820, 120, 700, 380], m('car', -.4), 'from the car', true);
  const check = x => { const c = path(p, `M${x} 455l18 18l36 -42`, { stroke: COL.good, 'stroke-width': 9 }, { d: 0 }); draw(c, m('both'), .5); };
  check(700); check(1440);
  txt(p, 'Both are correct.', 800, 560, m('both'), { size: 34, fill: COL.good });
  show(runs(p, [['Motion is ', COL.chalk], ['relative', PH.ref], ['.', COL.chalk]], { x: 800, y: 660, size: 72 }), m('rel'));
  show(runs(p, [['It is always described in relation to a ', COL.chalk], ['reference point', PH.ref], ['.', COL.chalk]], { x: 800, y: 745, size: 40, weight: 500 }), m('refpt'));
  txt(p, 'reference point = the place or object you measure from', 800, 808, m('refpt', 3), { size: 30, fill: COL.dim, weight: 500 });
}],
['earth', 'Why we don\'t feel Earth spin', (m, D) => {
  const p = panel(0);
  const sky = mk('rect', { width: 1600, height: 900, fill: PH.sky }, p);
  const cam = camera(p, D);
  // Open on the ground, rolling with it (nothing moves), then pull back into space: the spin appears.
  cam.cut(groundView(26, 6), 0).to({ x: 800, y: 450, z: 1, r: 0 }, m('earth'), 3.4);
  const stars = cam.layer(.15);
  for (let i = 0; i < 40; i++) { const k = 2 + 3 * phHash(i, 5); mk('rect', { x: -1400 + 4400 * phHash(i, 1), y: -1000 + 2900 * phHash(i, 2), width: k, height: k, fill: COL.chalk, opacity: .3 + .5 * phHash(i, 3) }, stars); }
  const { you } = earthWorld(cam, D);
  clockRun(t => { const k = Math.min(1, Math.max(0, (cam.at(t).z - 1.6) / 2)); put(sky, { o: k }); put(stars, { o: 1 - k }); }, D);
  const rimRing = mk('rect', { x: -15, y: -36, width: 30, height: 40, rx: 6, fill: 'none', stroke: PH.ref, 'stroke-width': 2.5 }, you);
  put(rimRing, { o: 0 });
  const arcs = G(cam.world, { o: 0 });
  const arc = (a1, a2) => {
    const rr = ER + 92, P = a => [EX + rr * Math.cos(a * Math.PI / 180), EY + rr * Math.sin(a * Math.PI / 180)];
    const [x1, y1] = P(a1), [x2, y2] = P(a2), t = a2 * Math.PI / 180, dx = Math.sin(t), dy = -Math.cos(t);
    path(arcs, `M${x1} ${y1}A${rr} ${rr} 0 0 0 ${x2} ${y2}`, { stroke: COL.chalk, 'stroke-width': 5 });
    path(arcs, `M${x2 - 18 * dx - 10 * dy} ${y2 - 18 * dy + 10 * dx}L${x2} ${y2}L${x2 - 18 * dx + 10 * dy} ${y2 - 18 * dy - 10 * dx}`, { stroke: COL.chalk, 'stroke-width': 5 });
  };
  arc(215, 145); arc(35, -35);
  show(arcs, m('earth', 2.8));
  txt(p, 'Seen from far above the North Pole', 70, 80, m('earth'), { size: 32, fill: COL.dim, anchor: 'start' });
  txt(p, 'counterclockwise', EX, 772, m('earth', 3.2), { size: 30, fill: COL.chalk });
  const eq = mk('circle', { cx: EX, cy: EY, r: ER, fill: 'none', stroke: COL.int, 'stroke-width': 7, transform: `rotate(-90 ${EX} ${EY})` }, cam.world);
  eq.setAttribute('pathLength', 1); eq.setAttribute('stroke-dasharray', '1 1'); put(eq, { d: 0 }); draw(eq, m('fast'), 1.2);
  runs(p, [['equator (the rim): ', COL.int], ['more than 1,000 mph', COL.chalk]], { x: EX, y: 818, size: 30, o: 0 });
  show(p.lastChild, m('fast', .4));
  const rx = 1180;
  txt(p, 'Why can\'t we feel it?', rx, 200, m('why'), { size: 42 });
  txt(p, 'Everything near you spins along with Earth.', rx, 260, m('along'), { size: 28, fill: COL.dim, weight: 500 });
  show(rimRing, m('along', 1));
  // Picture-in-picture: a second camera that stays with you on the ground.
  const box = [880, 300, 600, 380];
  const pip = camera(p, D, { box, bg: PH.sky });
  pip.cut(groundView(20, 6), 0);
  phPin(earthWorld(pip, D).you, { y: -34, s: .3 });
  put(pip.el, { s: 0, o: 0 }); pop(pip.el, m('zoom'));
  show(phLabel(p, 'from where you stand', { x: box[0] + 24, y: box[1] + box[3] - 22, size: 28, fill: PH.ref, anchor: 'start', o: 0 }), m('zoom', .3));
  txt(p, 'house, tree, ground: 0 mph', rx, 740, m('zoom', .3), { size: 32 });
  txt(p, 'Nothing seems to move.', rx, 790, m('zoom', .3), { size: 32, fill: COL.good });
}, { lead: false }],   // the ground shot is on screen from the first frame
['q1', 'Quick check', (m, D) => {
  const p = panel(0);
  const GY = 430;
  phBlock(p, 0, GY + 2, 1600, 10, '#6b5a48', { top: 3, ol: 0 });
  path(p, Array.from({ length: 27 }, (_, i) => `M${i * 60 + 10} ${GY + 12}h34`).join(''), { stroke: '#4a3d31', 'stroke-width': 6 });
  path(p, [0, 40, 80].map(k => `M${720 - 520} ${GY - 120 - k}H${720 - 620}`).join(''), { stroke: COL.chalk, 'stroke-width': 6, opacity: .6 });
  const train = phCarriage(p, { x: 720, y: GY, w: 1000 });
  put(train, { o: 0 }); show(train, .2);

['speed', 'Speed = distance ÷ time', (m, D) => {

  const ans = runs(p, [['= ', COL.chalk], ['3 m/s', COL.chalk]], { x: 990, y: y + 16, size: 56, anchor: 'start', weight: 700 });

['units', 'Meters per second', (m, D) => {
  const p = panel(0);
  const X0 = 220, U = 50, TY = 640, xm = v => X0 + U * v, t0 = m('each', .2), t1 = t0 + 4.8;
  runs(p, [['distance → ', COL.dim], ['meters (m)', DIST]], { x: 420, y: 150, size: 40 }); show(p.lastChild, .2);

['average', 'Average speed', (m, D) => {
  const p = panel(0);
  const X0 = 170, U = 4.2, xm = v => X0 + U * v, LA = 420, LB = 640;
  const lane = y => { phBlock(p, 0, y - 70, 1600, 100, PH.road, { top: 0, ol: 0 }); path(p, `M0 ${y - 66}H1600M0 ${y + 26}H1600`, { stroke: PH.line, 'stroke-width': 3, opacity: .5 }); };
  lane(LA);
  for (let v = 0; v <= 300; v += 50) T(p, `${v}`, { x: xm(v), y: LA + 66, size: 24, fill: COL.chalk, anchor: 'middle' });
  T(p, 'meters', { x: xm(300) + 40, y: LA + 66, size: 22, fill: COL.dim });
  const light = phSprite(p, 'light_red', { x: xm(150) + 92, y: LA - 66 });
  const car = phCar(p, { x: xm(0), y: LA + 18, s: .5 });
  const vLab = phLabel(p, '', { y: LA - 112, size: 28, fill: PH.car });
  const clk = simClock(p, 1460, 190, 40);
  // First run, time-lapse: drive (sim 0–10 s), wait at the light (10–18 s), drive on (18–30 s), timed to the words.
  const go = m('go'), st = m('stop'), ag = m('again'), g0 = m('ghost', .3), g1 = g0 + 5;
  const sim1 = t => t < go ? 0 : t < st ? 10 * ramp(t, go, st) : t < ag ? 10 + 8 * ramp(t, st, ag) : 18 + 12 * ramp(t, ag, ag + 2.2);
  const ghostG = G(p, { o: 0 });
  lane(LB); ghostG.append(p.lastChild.previousSibling, p.lastChild);   // the second lane belongs to the replay
  const ghost = phCar(ghostG, { x: xm(0), y: LB + 18, s: .5, o: .55 });
  phLabel(ghostG, 'steady 10 m/s, all the way', { x: 150, y: LB + 74, size: 28, fill: COL.chalk, anchor: 'start' });
  show(ghostG, m('ghost'));
  clockRun(t => {
    const s = t < g0 ? sim1(t) : 30 * ramp(t, g0, g1), x = xm(tripX(s));
    put(car, { x }); phRoll(car, tripX(s) * U / .5); put(vLab, { x });
    phText(vLab, `${tripV(s)} m/s`); put(vLab, { o: t >= go && s < 30 ? 1 : 0 });   // speed now; hidden once arrived
    phFrame(light, s >= 10 && s < 18 ? 'light_red' : s >= 18 ? 'light_green' : 'light_red');
    clk.set(s);
    const gx = xm(10 * (t < g0 ? 0 : s)); put(ghost, { x: gx }); phRoll(ghost, 10 * s * U / .5);
  }, D);
  const tot = G(p, { o: 0 });
  path(tot, `M${xm(0)} ${LA + 84}V${LA + 100}H${xm(300)}V${LA + 84}`, { stroke: DIST, 'stroke-width': 4 });
  T(tot, 'total distance: 300 m', { x: xm(150), y: LA + 134, size: 30, weight: 700, fill: DIST, anchor: 'middle' });
  show(tot, m('total', .8));
  txt(p, 'total time: 30 s', 1460, 320, m('total', 1.6), { size: 28, fill: TIME });

  show(T(p, 'average speed =', { x: 560, y: y + 14, size: 44, weight: 700, anchor: 'end', o: 0 }), m('avg'));
  show(wfrac(p, 'total distance', 'total time', 730, y, { size: 38, ct: DIST, cb: TIME }), m('avg', .4));
  show(T(p, '=', { x: 900, y: y + 14, size: 44, weight: 700, anchor: 'middle', o: 0 }), m('ten'));
  show(wfrac(p, '300 m', '30 s', 990, y, { size: 38, ct: DIST, cb: TIME }), m('ten'));
  const ans = T(p, '= 10 m/s', { x: 1070, y: y + 16, size: 48, weight: 700, anchor: 'start', o: 0 });
  pop(put(ans, { s: .6 }), m('ten', .9));
}, { lead: false }],   // road and car are on screen from the first frame
['instant', 'Instantaneous speed', (m, D) => {
  const p = panel(0);
  const cam = camera(p, D), w = cam.world;
  const X0 = 150, U = 12.5, TY = 640, xm = v => X0 + U * v;
  meterTrack(w, { x0: X0, U, y: TY, to: 100, every: 10, size: 24 });
  for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) mk('rect', { x: xm(100) - 8 + 8 * j, y: TY - 160 + 10 * i, width: 8, height: 10, fill: (i + j) % 2 ? COL.chalk : PH.out }, w);   // finish line
  T(w, 'finish', { x: xm(100), y: TY + 92, size: 26, weight: 700, fill: COL.chalk, anchor: 'middle' });
  const run = phPerson(w, { role: 'runner', x: xm(0), y: TY });
  // Run 1 (time-lapse) after "go"; run 2 from "but" in slower motion, frozen at 90 m for the snapshot, then to the finish.
  const a0 = m('go', .1), a1 = a0 + 3, b0 = m('but', .2), fz = b0 + 9 * .7, f1 = m('inst', 1.8);
  const tau = t => t < b0 ? 10 * ramp(t, a0, a1) : t < fz ? (t - b0) / .7 : t < f1 ? 9 : 9 + ramp(t, f1, f1 + .7);
  const sx = t => xm(sprintX(tau(t)));
  cam.to({ x: t => sx(t), y: TY - 80, z: 1.9 }, m('fast', .2), 1.4).to({ x: 800, y: 450, z: 1 }, f1 + .9, 1.2);
  const clk = simClock(p, 1460, 190, 40);
  const vg = G(p, { o: 0 }), vLab = phLabel(vg, '', { size: 30, fill: COL.task });
  show(vg, b0);
  clockRun(t => {
    const s = tau(t), x = sx(t);
    const still = t >= fz && t < f1;   // frozen for the snapshot
    put(run, { x }); if (!still) { if (s > 0 && s < 10) walkTo(run, x, 30); else phPose(run); }
    clk.set(s);
    phText(vLab, `now: ${Math.round(sprintV(s))} m/s`); cam.track(vLab, x, TY - 150, t);
  }, D);
  runs(p, [['average speed = 100 m ÷ 10 s = ', COL.chalk], ['10 m/s', COL.chalk]], { x: 800, y: 100, size: 40, weight: 700 });
  show(p.lastChild, m('avg', .9));
  const snap = G(p, { o: 0 });
  [[700, 330, 1, 1], [900, 330, -1, 1], [700, 610, 1, -1], [900, 610, -1, -1]].forEach(([x, y, dx, dy]) => path(snap, `M${x} ${y + 40 * dy}V${y}H${x + 40 * dx}`, { stroke: COL.task, 'stroke-width': 6 }));
  show(snap, fz, .2); hide(snap, f1, .3);
  runs(p, [['instantaneous speed', COL.task], [': the speed at one moment', COL.chalk]], { x: 800, y: 180, size: 38 });
  show(p.lastChild, m('inst'));
}, { lead: false }],   // track and runner are on screen from the first frame

      () => floatText('dolphin: 7 m/s > 5 m/s', 800, 130, COL.good)) },
