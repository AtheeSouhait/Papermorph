<script>
'use strict';
// Chapter 10, one page in book order: part 1 (force, net force, balanced forces, newtons), part 2 (first law: inertia,
// momentum), part 3 (second law), part 4 (third law), then the chapter practice.
const CHAPTER = { number: 10, title: 'Force and Newton’s Laws of Motion', minutes: 13, language: 'en' };
const Q_CARD = { x: 96, y: 586, w: 1408, cls: 'band' };   // a band card under the scenes; it moves up by itself when taller
const GY = 560;                                           // ground line in side-view scenes
// A ground band, not a slab: the space below stays free for values and notes.
const ground = (p, y = GY) => { phBlock(p, 0, y, 1600, 70, PH.grass, { top: 8, ol: 0 }); mk('rect', { x: 0, y: y + 70, width: 1600, height: 6, fill: PH.grass, opacity: .5 }, p); };
const TY = { title: 100, rule: 40, value: 40, label: 30, note: 26 };   // the type scale: title, rule, key values, labels, notes
const N = 40;                                             // force arrows: 40 px per newton (scaled per scene where noted)

/* ---------- actors and light context ---------- */
const park = (p, xs = [90, 1530]) => xs.forEach(x => phSprite(p, 'tree', { x, y: GY + 2 }));
function rink(p) {          // an ice rink: boards behind, a red centre line
  phBlock(p, 0, GY, 1600, 110, '#cfe8f3', { top: 8, ol: 0 });
  phBlock(p, 0, GY - 64, 1600, 64, '#eef5f7', { top: 0, ol: 0 });
  mk('rect', { x: 0, y: GY - 70, width: 1600, height: 8, fill: '#3f6f9e' }, p);
  mk('rect', { x: 796, y: GY + 8, width: 8, height: 102, fill: '#d24b4b', opacity: .5 }, p);
}
function goal(p, x) {       // a pixel soccer goal (side view)
  path(p, `M${x} ${GY}V${GY - 150}H${x + 90}`, { stroke: '#ece8dc', 'stroke-width': 10 });
  path(p, `M${x + 10} ${GY - 140}L${x + 90} ${GY}M${x + 30} ${GY - 140}L${x + 90} ${GY - 40}`, { stroke: '#ece8dc', 'stroke-width': 2, opacity: .5 });
}
// A pusher with a cart (or car) that stays on her hands: at(x, dist) walks her and places the load at her hand.
function pusher(p, role, load = 'cart') {
  const a = phActor(p, role, { y: GY, anim: 'push' }), c = load === 'car' ? phCar(p, { y: GY }) : phSprite(p, 'cart', { y: GY });
  return { a, c, at(x, dist, walk = true) {
    put(a, { x }); if (walk) a.stride('push', dist); else a.show('push', 0);
    const [hx] = a.hand('F'); put(c, { x: hx + (load === 'car' ? 126 : 52) }); if (load === 'car') phRoll(c, hx);
    return hx;
  } };
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- part 1: force and net force ---------- */
['intro', 'Force and Newton’s laws', (m, D) => {
  const p = panel(0);
  ground(p); park(p, [1200, 1460]);
  const ps = pusher(p, 'you'), f = forceArrow(p);
  clockRun(t => { const d = 20 * t * t, hx = ps.at(260 + d, d); f.set(hx + 20, GY - 140, 120, 0, 'push'); }, D);
  const g = G(p, { o: 0, y: 24 });
  T(g, 'Unit 3 · Motion, Forces, and Work · Chapter 10', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle' });
  phLabel(g, 'Force and Newton’s Laws', { x: 800, y: 240, size: 92, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out);
  txt(p, 'What makes things start, stop, speed up, or turn?', 800, 320, m('sub'), { size: 36, fill: COL.dim });
}],
['force', 'A push or a pull', (m, D) => {
  const p = panel(0);
  ground(p); park(p, [40, 1560]);
  txt(p, 'A force is a push or a pull', 800, 110, .2, { size: TY.rule });
  const t1 = m('push'), t2 = m('pull'), ts = m('shape');
  // Both carts speed up for as long as they are the subject; at "shape" the whole group freezes and dims together.
  const aPush = 2 * 250 / (ts - t1) ** 2, aPull = 2 * 240 / (ts - t2) ** 2;
  const push = G(p), pull = G(p);
  const ps = pusher(push, 'you'), f1 = forceArrow(push);
  const pc = phSprite(pull, 'cart', { y: GY }), pa = phActor(pull, 'friend', { y: GY, anim: 'pull' }), rope = path(pull, '', { stroke: '#c9b38d', 'stroke-width': 5 }), f2 = forceArrow(pull);
  T(push, 'push', { x: 330, y: 200, size: TY.label, weight: 700, fill: FORCE, anchor: 'middle' });
  T(pull, 'pull', { x: 1100, y: 200, size: TY.label, weight: 700, fill: FORCE, anchor: 'middle' });
  put(pull, { o: 0 }); show(pull, t2 - .2);
  const sizes = G(p, { o: 0 }), small = forceArrow(sizes), big = forceArrow(sizes);
  small.set(360, 720, 2 * N, 0, '2 N'); big.set(860, 720, 6 * N, 0, '6 N');
  T(sizes, 'longer arrow = bigger force; it points the way of the push or pull', { x: 800, y: 800, size: TY.note, fill: COL.chalk, anchor: 'middle' });
  show(sizes, m('dir'));
  // The can is squeezed from above and below: it flattens step by step, then keeps its crushed shape.
  const can = G(p, { o: 0 }), cg = G(can, { x: 800, y: 760 }), cs = phSprite(cg, 'can', { s: 2 }), sq1 = forceArrow(can), sq2 = forceArrow(can);
  show(can, ts); hide(sizes, ts - .3, .3); tw(push, { o: .3 }, ts, .4); tw(pull, { o: .3 }, ts, .4);
  txt(p, 'a force can change a shape', 800, 860, ts + .3, { size: TY.label, fill: COL.chalk });
  clockRun(t => {
    const tt = Math.min(t, ts), u = Math.max(0, tt - t1), d = aPush * u * u / 2, hx = ps.at(150 + d, d, u > 0);
    f1.set(hx + 20, GY - 140, t > t1 - .2 ? 110 : 0, 0, '');
    const v = Math.max(0, tt - t2), d2 = aPull * v * v / 2, x2 = 1150 + d2;
    put(pa, { x: x2 }); pa.stride('pull', d2);
    const [rx, ry] = pa.hand('F'), cx = rx - 150; put(pc, { x: cx });
    rope.setAttribute('d', `M${cx + 50} ${GY - 60}L${rx} ${ry}`); f2.set(cx + 60, GY - 120, t > t2 - .2 ? 100 : 0, 0, '');
    const k = ramp(t, ts + .6, ts + 1.6), crushed = k >= 1, sy = 1 - .375 * k, sx = 1 + .4 * k, h = 128 * sy;
    phFrame(cs, crushed ? 'can_crushed' : 'can');
    cs._in.setAttribute('transform', crushed ? '' : `scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
    put(cg, { y: 760 - (128 - (crushed ? 80 : h)) / 2 });          // the can's centre stays put while it flattens
    const top = 696 - (crushed ? 40 : h / 2), bot = 696 + (crushed ? 40 : h / 2);
    sq1.set(800, top - 100, 90, 90, ''); sq2.set(800, bot + 100, 90, -90, '');
  }, D);
}],
['net', 'Net force', (m, D) => {
  const p = panel(0);
  phBlock(p, 0, GY - 300, 1600, 300, '#26372f', { top: 0, ol: 0 });
  [200, 600, 1000, 1400].forEach(x => mk('rect', { x, y: GY - 300, width: 6, height: 300, fill: '#1f2e28' }, p));
  ground(p); crate(p, { x: 170, y: GY, w: 110, h: 90 }); crate(p, { x: 170, y: GY - 90, w: 90, h: 80 }); crate(p, { x: 1440, y: GY, w: 120, h: 100 });
  txt(p, 'Net force: the total of all the forces on an object', 800, 110, .2, { size: TY.rule });
  const ta = m('add'), ts = m('sub');
  // Two examples, each its own crate: it starts moving once the net force is shown and keeps speeding up while the
  // forces act; the first example fades out before the second fades in.
  const ex = [0, 1].map(k => { const g = G(p, { o: k ? 0 : 1 }); return { g, c: crate(g, { x: 800, y: GY }), A: forceArrow(g), B: forceArrow(g), NF: forceArrow(g, { color: NETF, w: 14, size: TY.label }) }; });
  hide(ex[0].g, ts - .5, .4); show(ex[1].g, ts - .1, .4);
  const eq1 = runs(p, [['3 N + 2 N = ', COL.chalk], ['5 N →', NETF]], { x: 800, y: 760, size: TY.value, weight: 700 }),
    eq2 = runs(p, [['5 N − 3 N = ', COL.chalk], ['2 N →', NETF]], { x: 800, y: 760, size: TY.value, weight: 700 });
  show(eq1, ta + 2.6); hide(eq1, ts - .5, .3); show(eq2, ts + 3.1);
  txt(p, 'same direction: add · opposite directions: subtract', 800, 830, m('netw'), { size: TY.note, fill: COL.dim, weight: 500 });
  const a1 = 2 * 120 / (ts - .5 - (ta + 2.5)) ** 2, a2 = 2 * 80 / (D - (ts + 3)) ** 2;
  clockRun(t => {
    const u1 = Math.max(0, Math.min(t, ts - .5) - ta - 2.5), x1 = 800 + a1 * u1 * u1 / 2, e1 = ex[0];
    put(e1.c, { x: x1 }); const on1 = t > ta;
    e1.A.set(x1 + 80, GY - 95, on1 ? 3 * N : 0, 0, '3 N'); e1.B.set(x1 + 80, GY - 40, on1 ? 2 * N : 0, 0, '2 N', 0, 50); e1.NF.set(x1 - 100, GY + 105, t > ta + 2.5 ? 5 * N : 0, 0, 'net force', 0, -16);
    const u2 = Math.max(0, t - ts - 3), x2 = 800 + a2 * u2 * u2 / 2, e2 = ex[1], on2 = t > ts - .1;
    put(e2.c, { x: x2 });
    e2.A.set(x2 + 80, GY - 70, on2 ? 5 * N : 0, 0, '5 N'); e2.B.set(x2 - 80, GY - 70, on2 ? 3 * N : 0, 180, '3 N'); e2.NF.set(x2 - 40, GY + 105, t > ts + 3 ? 2 * N : 0, 0, 'net force', 0, -16);
  }, D);
}, { lead: false }],
['balance', 'Balanced and unbalanced', (m, D) => {
  const p = panel(0);
  ground(p); park(p, [70, 1540]);
  const tb = m('bal'), tu = m('unbal'), S = .4 * N;
  const L = phActor(p, 'friend', { y: GY, anim: 'strain' }), R = phActor(p, 'you', { y: GY, anim: 'strain' }).face(-1);
  const rope = path(p, '', { stroke: '#c9b38d', 'stroke-width': 7 }), mark = G(p);
  mk('rect', { x: -6, y: -20, width: 12, height: 40, fill: COL.bad }, mark);
  path(p, `M800 ${GY + 10}V${GY + 60}`, { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '6 6' });
  const FL = forceArrow(p), FR = forceArrow(p), NF = forceArrow(p, { color: NETF, w: 14, size: 32 });
  const tag = phLabel(p, '', { x: 800, y: 180, size: 48 });
  clockRun(t => {
    const pull = t < tu ? 10 : 10 + 5 * ramp(t, tu, tu + .8), u = Math.max(0, t - tu - .8), dx = Math.min(100, 16 * u * u);
    const shake = Math.sin(t * 31) * 1.5;                       // straining: a small shake
    put(L, { x: 420 + dx + shake }); put(R, { x: 1150 + dx - shake });
    if (dx > 0) { L.stride('stumble', dx); R.stride('backstep', dx); } else { L.show('strain', t * 3); R.show('strain', t * 3 + 1); }
    const [lx, ly] = L.hand('F'), [rx, ry] = R.hand('F');
    rope.setAttribute('d', `M${lx} ${ly}L${rx} ${ry}`); put(mark, { x: (lx + rx) / 2, y: (ly + ry) / 2 });
    const on = t > tb - .2;
    FL.set(lx - 20, GY - 150, on ? 10 * S : 0, 180, '10 N'); FR.set(rx + 20, GY - 150, on ? pull * S : 0, 0, `${Math.round(pull)} N`);
    NF.set(700 + dx, GY + 110, t > tu + .9 ? 5 * S : 0, 0, 'net force: 5 N', 0, -14);
    phText(tag, t < tb ? '' : t < tu ? 'balanced: net force = 0 N' : 'unbalanced: net force = 5 N →');
  }, D);
}],
['newton', 'The newton', (m, D) => {
  const p = panel(0);
  txt(p, 'Force is measured in newtons (N)', 800, 110, .2, { size: TY.rule });
  phSprite(p, 'apple', { x: 520, y: 460, s: 3 });
  const ag = G(p, { o: 0 }); forceArrow(ag).set(520, 600, 125, -90, 'hand: 1 N', -100, 20); forceArrow(ag).set(520, 175, 125, 90, 'gravity: 1 N', 120, 20);
  show(ag, m('apple'));
  txt(p, 'holding up an apple ≈ 1 N', 520, 680, m('apple', .4), { size: TY.label });
  const def = G(p, { o: 0 });
  runs(def, [['1 N', FORCE], [' = 1 kg × 1 ', COL.chalk], ['m/s²', ACC]], { x: 1150, y: 330, size: 56, weight: 700, o: 1 });
  T(def, 'the force that gives 1 kg an acceleration of 1 m/s²', { x: 1150, y: 390, size: TY.note, fill: COL.dim, anchor: 'middle' });
  show(def, m('def'));
  const blk = G(p, { o: 0 }), b = crate(blk, { w: 110, h: 90, label: '1 kg' }), fb = forceArrow(blk), ab = path(blk, '', { stroke: ACC, 'stroke-width': 8 });
  phBlock(blk, 880, 600, 600, 10, PH.walk, { top: 0, ol: 0 });
  show(blk, m('def', .5));
  const t0 = m('def', .8), aB = 2 * 380 / (D - t0) ** 2;      // the push lasts to the end: the block reaches the far end then
  clockRun(t => { const u = Math.max(0, t - t0), x = 940 + aB * u * u / 2; put(b, { x, y: 600 }); fb.set(x + 56, 555, 70, 0, '1 N'); arrowAt(ab, x - 40, 480, 80, 0); }, D);
}, { lead: false }],
['q1', 'Quick check', (m, D) => {
  const p = panel(0);
  ground(p); park(p, [70, 1540]);
  const L = phActor(p, 'friend', { x: 420, y: GY, anim: 'strain' }), R = phActor(p, 'you', { x: 1150, y: GY, anim: 'strain' }).face(-1), rope = path(p, '', { stroke: '#c9b38d', 'stroke-width': 7 });
  const fl = forceArrow(p), fr = forceArrow(p);
  clockRun(t => { const sh = Math.sin(t * 31) * 1.5; put(L, { x: 420 + sh }); put(R, { x: 1150 - sh }); L.show('strain', t * 3); R.show('strain', t * 3 + 1);
    const [lx, ly] = L.hand('F'), [rx, ry] = R.hand('F'); rope.setAttribute('d', `M${lx} ${ly}L${rx} ${ry}`);
    fl.set(lx - 20, GY - 150, 10 * .4 * N, 180, 'brother: 10 N'); fr.set(rx + 20, GY - 150, 15 * .4 * N, 0, 'you: 15 N'); }, D);
}, { ask: done => quiz(Q_CARD, [
  { id: 'c-tug', prompt: ['Tug-of-war: you pull with 15 newtons, your brother pulls the other way with 10 newtons. What is the ', h('b', '', 'net force'), '?'],
    build: blanks([{ parts: ['net force = 15 − 10 = ', { box: '5' }, ' newtons'], why: 'Opposite directions subtract: 15 − 10 = 5 newtons, toward you.', hint: 'The forces point in opposite directions, so subtract.' }]) },
  { id: 'c-tugdir', prompt: ['Which way does the rope start to move?'],
    build: choice([['toward you'], ['toward your brother'], ['it does not move']], 0,
      'The net force (5 newtons) points toward you, the stronger pull.',
      [null, 'Your brother pulls with less force; the net force points toward you.', 'The forces are unbalanced (15 vs 10), so the rope moves.']) },
  { id: 'c-bal', prompt: ['Two teams each pull with 20 newtons in opposite directions. These forces are…'],
    build: choice([['balanced: the net force is 0'], ['unbalanced: the net force is 40 newtons']], 0,
      'Equal and opposite forces cancel: the net force is 0, so nothing changes.',
      [null, 'They point in opposite directions, so subtract: 20 − 20 = 0.']) },
], done) }],
['wrap1', 'Summary · Force', (m, D) => {
  const p = panel(0);
  txt(p, 'Force and net force', 800, 140, .2, { size: 40, fill: COL.dim });
  [['A force is a push or a pull, with a size and a direction.', 'w1'],
   ['Same direction: add. Opposite directions: subtract. The total is the net force.', 'w2'],
   ['Balanced forces cancel out; unbalanced forces change motion.', 'w3']].forEach(([s, mark], i) => {
    const g = G(p, { x: -16, y: 290 + i * 130, o: 0 });
    mk('rect', { x: 144, y: -38, width: 52, height: 52, rx: 6, fill: PH.ref }, g);
    T(g, String(i + 1), { x: 170, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
    T(g, s, { x: 230, size: 36, weight: 600 });
    tw(g, { o: 1, x: 0 }, m(mark), .6);
  });
  txt(p, 'Next: Newton’s first law.', 800, 760, m('end'), { size: 32, fill: COL.dim, weight: 500 });
}],
/* ---------- part 2: Newton's first law ---------- */
['part2', 'Part 2 · The first law', (m, D) => {
  const p = panel(0);
  ground(p); park(p, [180]); goal(p, 1380);
  phBall(p, 28, { x: 800, y: GY - 28 }); const k = phActor(p, 'you', { x: 740, y: GY, anim: 'stand' });
  clockRun(t => k.show('stand'), D);
  const g = G(p, { o: 0, y: 24 });
  T(g, 'Chapter 10 · Force and Newton’s laws', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle' });
  phLabel(g, 'The First Law', { x: 800, y: 250, size: TY.title, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out);
  txt(p, 'Part 2 · Inertia and momentum', 800, 320, m('q'), { size: 36, fill: COL.dim });
}],
['rest', 'At rest, in motion', (m, D) => {
  const p = panel(0);
  const tk = m('kick'), ts = m('space'), R = 28, V0 = 360, A = 90, T0 = V0 / A;     // grass friction: 90 px/s², stops after 4 s
  const field = camera(p, D);
  // push in on the kick (set-up, contact, follow-through), then pull back to watch the ball roll and stop
  field.to({ x: 560, y: GY - 110, z: 1.7 }, tk - 1.5, .9).to({ x: 800, y: 450, z: 1 }, tk + .8, 1.1);
  ground(field.world); park(field.world, [120]); goal(field.world, 1440);
  const ball = phBall(field.world, R, { x: 560, y: GY - R }), kid = phActor(field.world, 'you', { x: 482, y: GY, anim: 'stand' });
  const vA = path(field.world, '', { stroke: VEL, 'stroke-width': 8 }), kick = forceArrow(field.world, { size: 20 }), fr = forceArrow(field.world);   // 'kick' is read at 1.7× zoom
  const stay = txt(p, 'at rest: it stays at rest', 800, 150, m('stay'), { size: TY.label });
  const roll = txt(p, 'friction from grass and air slows it and stops it', 800, 210, m('stop'), { size: TY.label, fill: FORCE });
  const sky = camera(p, D, { x: 800, y: 450 });
  put(sky.el, { o: 0 }); show(sky.el, ts, .7);
  prog(q => { if (q === 1) field.el.style.display = 'none'; }, ts + .75, 0, lin);
  const stars = sky.layer(1, 2400);
  for (let i = 0; i < 70; i++) { const k = 2 + 3 * phHash(i, 7); mk('rect', { x: -800 + 4800 * phHash(i, 1), y: 900 * phHash(i, 2), width: k, height: k, fill: COL.chalk, opacity: .3 + .5 * phHash(i, 3) }, stars); }
  const sb = phBall(sky.world, R, { y: 450 }), sv = path(sky.world, '', { stroke: VEL, 'stroke-width': 8 });
  const sx = t => 300 + 220 * (t - ts);
  sky.cut({ x: t => sx(t) + 300 }, 0);
  const sl = G(p, { o: 0 }); phLabel(sl, 'deep space: no friction', { x: 800, y: 120, size: TY.rule }); phLabel(sl, 'velocity stays the same', { x: 800, y: 170, size: TY.label, fill: VEL });
  show(sl, ts + .4); hide(roll, ts, .3); hide(stay, ts, .3);
  clockRun(t => {
    const u = Math.max(0, t - tk), tt = Math.min(u, T0), x = 560 + V0 * tt - A * tt * tt / 2, v = t > tk && u < T0 ? V0 - A * u : 0;   // at rest until the kick
    put(ball, { x }); put(ball._spin, { r: (x - 560) / R * 180 / Math.PI });
    arrowAt(vA, x + R + 6, GY - R, v * .35, 0);
    kick.set(560 - R - 70, GY - R - 60, t > tk - .1 && t < tk + .15 ? 70 : 0, 0, 'kick', 0, -10);   // the kick force only during contact
    fr.set(x - R - 6, GY - 80, v > 0 && t > tk + .5 ? 70 : 0, 180, 'friction');
    kid.show(t < tk - .55 || t > tk + .7 ? 'stand' : 'kick', t < tk - .12 ? 0 : t < tk + .12 ? 1 : 2);   // wind-up, contact at the word, follow-through
    const z = sx(t); put(sb, { x: z }); put(sb._spin, { r: z / R * 180 / Math.PI }); arrowAt(sv, z + R + 6, 450, 110, 0);
  }, D);
}, { lead: false }],
['law1', 'Newton’s first law', (m, D) => {
  const p = panel(0);
  const law = G(p, { o: 0 });
  phLabel(law, 'An object at rest stays at rest, and an object in motion', { x: 800, y: 130, size: TY.rule - 4 });
  phLabel(law, 'stays in motion, unless a net force acts on it.', { x: 800, y: 180, size: TY.rule - 4 });
  show(law, m('law'));
  phBlock(p, 80, 470, 640, 14, PH.walk, { top: 0, ol: 0 }); crate(p, { x: 400, y: 470 });
  T(p, 'at rest → stays at rest', { x: 400, y: 540, size: TY.label, weight: 700, anchor: 'middle' });
  phBlock(p, 860, 470, 700, 14, '#cfe8f3', { top: 0, ol: 0 });
  const puck = mk('rect', { x: -30, y: -22, width: 60, height: 22, rx: 8, fill: '#22282a' }, G(p)).parentNode, pv = path(p, '', { stroke: VEL, 'stroke-width': 8 });
  T(p, 'in motion → stays in motion (same speed, same direction)', { x: 1210, y: 540, size: TY.note, weight: 700, anchor: 'middle' });
  const ig = G(p, { o: 0 });
  phLabel(ig, 'inertia', { x: 800, y: 680, size: 64, fill: COL.chalk });
  T(ig, 'matter resists changes to its motion: the first law is the law of inertia', { x: 800, y: 730, size: TY.note, fill: COL.dim, anchor: 'middle' });
  show(ig, m('inert'));
  // one slow, steady glide across the whole beat (no loop): constant velocity, nothing pushing it
  clockRun(t => { const x = 900 + 34 * t; put(puck, { x, y: 470 }); arrowAt(pv, x + 36, 425, 90, 0); }, D);
}],
['mass', 'More mass, more inertia', (m, D) => {
  const p = panel(0);
  const tc = m('catch'), LA = 330, LB = 610, V = 300, xc = 1170, tCatch = tc + (xc - 200) / V;

  forceArrow(snap.world, { w: 11, size: 30 }).set(rx + 56, ry, 120, 0, '50 N', 0, -8); forceArrow(snap.world, { w: 11, size: 30 }).set(650, GY - 110, 120, 180, '50 N', 0, -8);

['pairs', 'Action-reaction pairs', (m, D) => {
  const p = panel(0);
  const tt = m('tramp'), tr = m('run');
  txt(p, 'Action-reaction pairs', 800, 100, .2, { size: TY.rule });
  // Left: one full bounce told slowly: drop, contact and compression (held so the pair can be read), launch, flight.
  const L = G(p, { o: 0 }); show(L, tt - .3);
  path(L, 'M100 640V500M100 540H700M700 640V500', { stroke: '#5a6d63', 'stroke-width': 6, opacity: .7 });
  path(L, 'M180 640V720M620 640V720', { stroke: '#7d8a86', 'stroke-width': 10 });
  const bed = path(L, '', { stroke: '#2f3a44', 'stroke-width': 10 });
  const jumper = phActor(L, 'you', { x: 400, anim: 'jump' }), down = forceArrow(L), up = forceArrow(L);
  phLabel(L, 'you push down; it pushes you up', { x: 400, y: 790, size: TY.label });
  // phases (s after "tramp"): fall 0–.5, compress .5–.9, hold .9–1.9, launch 1.9–2.2, flight 2.2–3.4, then rest standing
  const bounce = t => {
    const k = t - tt + .5, g = 1100;               // px/s²
    if (k < .5) return { y: 640 - 260 + g / 2 * Math.min(k, .5) ** 2 * (260 / (g / 8)), sag: 0, pose: 'jump' };
    if (k < .9) return { y: 640 + 35 * ramp(k, .5, .9), sag: ramp(k, .5, .9), pose: 'land', push: true };
    if (k < 1.9) return { y: 675, sag: 1, pose: 'crouch', push: true };
    if (k < 2.2) return { y: 675 - 35 * ramp(k, 1.9, 2.2), sag: 1 - ramp(k, 1.9, 2.2), pose: 'land', push: true };
    if (k < 3.4) { const q = (k - 2.2) / 1.2; return { y: 640 - 260 * 4 * q * (1 - q), sag: 0, pose: 'jump' }; }   // parabola
    return { y: 640, sag: 0, pose: 'stand' };
  };
  // Right: a runner on a track, followed by a box camera: the ground slides back, the feet keep pace; no loop.
  const box = [860, 300, 640, 420], rc = camera(p, D, { box, x: 1100, y: 560, z: 1 });
  put(rc.el, { o: 0 }); show(rc.el, tr - .3);
  const track = rc.layer(1, 600);
  phBlock(track, -1200, 640, 6000, 20, '#8a6f55', { top: 4, ol: 0 });
  for (let x = -1200; x < 4800; x += 120) mk('rect', { x, y: 664, width: 60, height: 6, fill: PH.line, opacity: .5 }, track);
  const runner = phActor(rc.world, 'friend', { y: 640, anim: 'run' }), back = forceArrow(rc.world), fwd = forceArrow(rc.world);
  const rx = t => 1000 + 240 * Math.max(0, t - tr);
  rc.cut({ x: t => rx(t) + 100 }, 0);
  phLabel(p, 'your foot pushes back; the ground pushes you forward', { x: 1180, y: 790, size: TY.label, o: 0 }); show(p.lastChild, tr);
  clockRun(t => {
    const b = bounce(t);
    bed.setAttribute('d', `M180 640Q400 ${640 + 70 * b.sag} 620 640`); put(jumper, { y: t < tt - .5 ? 640 : b.y }); jumper.show(t < tt - .5 ? 'stand' : b.pose);
    const on = !!b.push && t > tt - .5;
    down.set(470, 600 + 35 * b.sag, on ? 90 : 0, 90, 'on the trampoline', 110, 40); up.set(330, 690, on ? 90 : 0, -90, 'on you', -70, 40);
    const x = rx(t), d = x - 1000;
    put(runner, { x }); if (t > tr) runner.stride('run', d); else runner.show('stand');
    const strike = t > tr && runner._f % 2 === 0;
    back.set(x - 10, 662, strike ? 80 : 0, 180, 'on the ground', -30, 50); fwd.set(x - 20, 500, strike ? 80 : 0, 0, 'on you', 0, 0);
  }, D);
}],
['earth', 'Why Earth doesn’t move', (m, D) => {
  const p = panel(0);

  const you = phActor(p, 'you', { x: 520, y: 560, anim: 'stand' }), dn = forceArrow(p), up = forceArrow(p);
  const ta = m('mass'), tt = m('tiny');

  const g1 = G(p, { o: 0 });
